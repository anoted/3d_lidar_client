<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiDAR Live</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(18, 21, 29, 0.86);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e6e8ee;
    --muted: #8a90a0;
    --accent: #4cc2ff;
    --ok: #3ddc97;
    --warn: #ffb547;
    --bad: #ff5d6c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: 268px; max-width: calc(100vw - 24px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    backdrop-filter: blur(8px); padding: 12px 14px; user-select: none; }
  #panel h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; letter-spacing: .02em;
    display: flex; align-items: center; gap: 8px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  #dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #dot.warn { background: var(--warn); }
  #dot.bad { background: var(--bad); }
  #collapse { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 2px; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-variant-numeric: tabular-nums; margin-bottom: 10px; }
  .stats span:nth-child(odd) { color: var(--muted); }
  .stats span:nth-child(even) { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #err { color: var(--bad); font-size: 12px; margin: -4px 0 8px; word-break: break-word; }
  #err:empty { display: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 7px 0; }
  .row label { color: var(--muted); flex: none; }
  .row output { color: var(--text); font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }
  input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  select { background: #1b1f2a; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font: inherit; }
  input[type=checkbox] { accent-color: var(--accent); }
  .buttons { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  button.b { flex: 1; background: #1b1f2a; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit; cursor: pointer; }
  button.b:hover { border-color: var(--accent); }
  button.b.on { background: var(--accent); color: #041018; border-color: var(--accent); }
  #panel.collapsed .body { display: none; }
  #legend { position: fixed; right: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); width: 200px; }
  #legend .bar { height: 8px; border-radius: 4px; margin: 5px 0 3px; }
  #legend .ends { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  #legend.hidden { display: none; }
  #hint { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }
  canvas.measuring { cursor: crosshair; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .mlabel { position: absolute; transform: translate(-50%, -130%); background: var(--panel); border: 1px solid #ffd54a66;
    border-radius: 6px; padding: 3px 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mlabel b { color: #ffd54a; font-size: 14px; }
  .mlabel b.in { margin-left: 4px; }
  .mlabel small { display: block; color: var(--muted); }
  @media (max-width: 600px) { #hint { display: none; } #legend { width: 150px; } }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="panel">
  <h1><span id="dot"></span>LiDAR Live<button id="collapse" title="Collapse">–</button></h1>
  <div class="body">
    <div class="stats">
      <span>Robot</span><span id="s-target">—</span>
      <span>Link</span><span id="s-link">—</span>
      <span>Source</span><span id="s-source">—</span>
      <span>Sensor</span><span id="s-pps">—</span>
      <span>Frames</span><span id="s-fps">—</span>
      <span>Per frame</span><span id="s-npts">—</span>
      <span>Bandwidth</span><span id="s-bw">—</span>
    </div>
    <div id="err"></div>
    <div class="row"><label for="color">Color by</label>
      <select id="color">
        <option value="0">Height</option>
        <option value="1">Intensity</option>
        <option value="2">Distance</option>
        <option value="3">Solid</option>
      </select></div>
    <div class="row"><label for="size">Point size</label><input id="size" type="range" min="1" max="8" step="0.5" value="2"><output id="size-v"></output></div>
    <div class="row"><label for="persist">Trail (s)</label><input id="persist" type="range" min="0.1" max="10" step="0.1" value="1"><output id="persist-v"></output></div>
    <div class="row"><label for="orient">Orientation</label>
      <select id="orient">
        <option value="imu">Level (IMU)</option>
        <option value="raw">Sensor frame</option>
        <option value="flip">Upside-down</option>
      </select></div>
    <div class="row"><label for="grid">Grid</label><input id="grid" type="checkbox" checked></div>
    <div class="buttons">
      <button class="b" id="pause" title="Space">Pause</button>
      <button class="b" id="top">Top view</button>
      <button class="b" id="reset" title="R">Reset view</button>
    </div>
    <div class="buttons">
      <button class="b" id="measure" title="M">Measure</button>
      <button class="b" id="clear-measure">Clear lines</button>
    </div>
  </div>
</div>
<div id="legend"><div id="legend-title">Height (m)</div><div class="bar" id="legend-bar"></div>
  <div class="ends"><span id="legend-lo"></span><span id="legend-hi"></span></div></div>
<div id="labels"></div>
<div id="hint">drag: orbit · right-drag: pan · scroll: zoom · space: pause</div>
<script type="module" src="./app.js"></script>
</body>
</html>
